# Builds the static site on every change to main (including admin-panel edits)
# and publishes the finished HTML to the "deploy" branch.
# Hostinger (hPanel → Advanced → GIT, Auto deployment) pulls the "deploy" branch.
name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Keep the demo address out of search engines. Remove for the real domain.
          SITE_NOINDEX: "1"

      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: true
          commit_message: "Site build"
